<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-директор</title></head><body><script>(async()=>{const n=15;const a=await Promise.all(Array.from({length:n},(_,i)=>fetch(`payload/${String(i).padStart(3,'0')}.txt`).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));document.open();document.write(a.join(''));document.close()})().catch(e=>{document.body.innerHTML='<div style="font:16px Arial;padding:40px">Не удалось загрузить сайт. Обновите страницу.</div>';console.error(e)})</script></body></html>
