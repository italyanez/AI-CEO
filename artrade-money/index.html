<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f3f5f9"><title>Вход · Деньги</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#151923;background:#f3f5f9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);padding:36px;background:#fff;border:1px solid #e3e7ef;border-radius:22px;box-shadow:0 24px 80px rgba(25,34,56,.12)}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.mark{width:34px;height:34px;border-radius:10px;background:#151923;color:#fff;display:grid;place-items:center}h1{font-size:28px;letter-spacing:-.035em;margin:34px 0 8px}p{margin:0 0 26px;color:#70798b;line-height:1.5}label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}input{width:100%;height:50px;padding:0 14px;border:1.5px solid #e3e7ef;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#315bd6;box-shadow:0 0 0 4px rgba(49,91,214,.1)}button{width:100%;height:50px;margin-top:14px;border:0;border-radius:12px;background:#315bd6;color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:12px;color:#c43d3d;font-size:13px}.note{margin:22px 0 0;font-size:12px;text-align:center;color:#9299a8}@media(max-width:520px){.card{padding:28px 22px}}
</style></head><body><main class="card"><div class="brand"><span class="mark">↗</span><span>Деньги · Розница</span></div><h1>Вход в финансовый кабинет</h1><p>Введите пароль, полученный от владельца отчёта.</p><form id="login"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit">Войти</button><div class="error" id="error"></div></form><div class="note">Зашифрованный доступ · AGENTANIUM</div></main><script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;button.textContent='Открываем…';error.textContent='';try{const p=await fetch('./report.enc.json?v=20261111-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load');return r.json()});const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const data=b64(p.data),tag=b64(p.tag),combined=new Uint8Array(data.length+tag.length);combined.set(data);combined.set(tag,data.length);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv),tagLength:128},key,combined);document.open();document.write(new TextDecoder().decode(plain));document.close()}catch(err){error.textContent='Неверный пароль.';button.disabled=false;button.textContent='Войти';document.getElementById('password').select()}});
</script></body></html>
